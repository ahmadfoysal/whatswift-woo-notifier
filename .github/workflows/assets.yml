name: Update WordPress.org listing

# Uploads the banner, icon, screenshots and readme without releasing a new
# version, when they change on main.
on:
  push:
    branches: [main]
    paths:
      - '.wordpress-org/**'
      - 'readme.txt'
  workflow_dispatch:

concurrency:
  group: wporg-deploy
  cancel-in-progress: false

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update listing assets and readme
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: whatswift-woo-notifier
          IGNORE_OTHER_FILES: true
